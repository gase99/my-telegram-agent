<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TERMINAL-AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f172a);
      --text-color: var(--tg-theme-text-color, #f8fafc);
      --hint-color: var(--tg-theme-hint-color, #94a3b8);
      --btn-color: var(--tg-theme-button-color, #3b82f6);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --sec-bg: var(--tg-theme-secondary-bg-color, #1e293b);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--btn-color);
    }
    .terminal-box {
      background-color: var(--sec-bg);
      border-radius: 12px;
      padding: 12px;
      flex-grow: 1;
      min-height: 300px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }
    button {
      background-color: var(--btn-color);
      color: var(--btn-text);
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="header">
    <h1>TERMINAL-AI Agent</h1>
  </div>
  <div class="terminal-box" id="output">در حال اتصال به ترمینال...</div>
  <div class="controls">
    <button id="actionBtn" onclick="handleAction()">اجرای فرمان جدید</button>
  </div>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }
    function handleAction() {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }
      const out = document.getElementById('output');
      out.innerText += '\n> دستور جدید دریافت شد...';
    }
  </script>
</body>
</html>
