<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal AI Shell</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #00ff66;
      font-family: monospace;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }
    #terminal {
      white-space: pre-wrap;
      word-break: break-all;
    }
    .input-line {
      display: flex;
      margin-top: 5px;
    }
    .prompt {
      color: #00bfff;
      margin-right: 5px;
    }
    input {
      background: transparent;
      border: none;
      color: #fff;
      font-family: monospace;
      outline: none;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="terminal">TERMINAL-AI Shell v2.0 (Intelligent Linux Kernel)
Type code or shell commands...
</div>
  <div class="input-line">
    <span class="prompt">root@tg-agent:~#</span>
    <input type="text" id="cmd" autofocus />
  </div>

  <script>
    const input = document.getElementById('cmd');
    const terminal = document.getElementById('terminal');

    input.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const val = input.value.trim();
        if (!val) return;
        terminal.innerText += `\nroot@tg-agent:~# ${val}\n`;
        input.value = '';

        const isCode = val.startsWith('python3 ') || val.startsWith('node ') || val.includes('print(') || val.includes('console.log(');
        const actionType = isCode ? 'execute' : 'chat';

        try {
          const res = await fetch('/api/agent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: val, action: actionType })
          });
          const data = await res.json();
          terminal.innerText += (data.response || data.error || 'No output') + '\n';
        } catch(err) {
          terminal.innerText += `Error: ${err.message}\n`;
        }
        window.scrollTo(0, document.body.scrollHeight);
      }
    });
  </script>
</body>
</html>
